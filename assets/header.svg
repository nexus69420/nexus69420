<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Dubey — Backend Engineer</title>
  <desc id="desc">A dark terminal-style banner with a glowing neural network motif and Aayush Dubey's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#08131A"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="80" x2="910" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EE787"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#30363D" stroke-opacity="0.28"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="960" cy="180" rx="310" ry="270" fill="url(#glow)"/>

    <rect x="34" y="30" width="1132" height="300" rx="16" fill="#0D1117" fill-opacity="0.72" stroke="#30363D"/>
    <circle cx="64" cy="58" r="6" fill="#F85149"/>
    <circle cx="84" cy="58" r="6" fill="#D29922"/>
    <circle cx="104" cy="58" r="6" fill="#3FB950"/>
    <text x="600" y="63" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">aayush@github — ~/build/what-matters</text>
    <path d="M34 82H1166" stroke="#30363D"/>

    <text x="86" y="133" fill="#7EE787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ whoami</text>
    <text x="84" y="205" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">AAYUSH DUBEY</text>
    <text x="88" y="247" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">BACKEND · MULTI-TENANCY · OCR / RAG · PLATFORMS</text>
    <text x="88" y="291" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">building systems that survive contact with reality</text>
    <rect x="610" y="277" width="10" height="19" rx="2" fill="#7EE787" filter="url(#softGlow)"/>

    <g stroke="#58A6FF" stroke-opacity="0.48" stroke-width="1.5">
      <path d="M858 127L946 104L1023 144L1095 112"/>
      <path d="M858 127L905 191L1023 144L1066 217"/>
      <path d="M905 191L969 248L1066 217L1110 269"/>
      <path d="M946 104L969 248L1095 112L1110 269"/>
    </g>
    <g fill="#0D1117" stroke="#7EE787" stroke-width="2" filter="url(#softGlow)">
      <circle cx="858" cy="127" r="7"/><circle cx="946" cy="104" r="7"/>
      <circle cx="1023" cy="144" r="7"/><circle cx="1095" cy="112" r="7"/>
      <circle cx="905" cy="191" r="7"/><circle cx="969" cy="248" r="7"/>
      <circle cx="1066" cy="217" r="7"/><circle cx="1110" cy="269" r="7"/>
    </g>
  </g>
</svg>
